[package]
name = "fnzero-safe-app-services"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
bip39 = { version = "2", features = ["rand", "zeroize"] }
base64 = "0.22"
bincode = "1.3"
borsh = { version = "1", features = ["derive"] }
fnzero-safe-core = { workspace = true, features = ["2fa", "mobile-solana-ops"] }
fnzero-safe-evm-services = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account-decoder-client-types = "3.1"
solana-client = "3.1.12"
solana-commitment-config = "3.1"
solana-derivation-path = "3.0"
solana-rpc-client-types = "3.1.12"
solana-sdk = "3.0"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
