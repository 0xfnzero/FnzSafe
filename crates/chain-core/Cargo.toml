[package]
name = "fnzero-safe-chain-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared chain adapter traits and types for FnzSafe"
homepage = "https://github.com/0xfnzero/FnzSafe"
documentation = "https://docs.rs/fnzero-safe-chain-core"
readme = "README.md"
keywords = ["wallet", "blockchain", "fnzsafe"]
