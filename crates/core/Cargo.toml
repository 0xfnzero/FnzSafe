[package]
name = "fnzero-safe-core"
version = "0.1.8"
edition = "2021"
rust-version = "1.89"
default-run = "fnzero-safe"
description = "FnzSafe Solana wallet key management library and CLI with encrypted keystores, bot integration, and optional 2FA"
license = "MIT"
repository = "https://github.com/0xfnzero/FnzeroSafe"
documentation = "https://docs.rs/fnzero-safe-core"
homepage = "https://github.com/0xfnzero/FnzeroSafe"
readme = "README.md"
keywords = ["solana", "wallet", "keystore", "encryption", "2fa"]
categories = ["cryptography", "command-line-utilities"]
exclude = ["../../apps/**", "../../Dockerfile", "../../Makefile", "../../.dockerignore"]

# Core dependencies (always required)
[dependencies]
# Transitive via solana-sdk → sha3; keep the patched implementation pinned.
keccak = { version = "=0.1.6" }
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22.1"
bs58 = "0.5"
ring = "0.17.8"
solana-sdk = "3.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2.4"
anyhow = "1.0"
hex = "0.4"
ghash = { version = "0.5", features = ["zeroize"] }
zeroize = "1"

# Interactive UI dependencies (needed for bot integration)
colored = "3.0.0"
rpassword = "7.0"

# Optional: CLI-only dependencies
clap = { version = "4.5", features = ["derive"], optional = true }
qrcode = { version = "0.14", optional = true }

# Optional: 2FA/TOTP features
totp-rs = { version = "5.4", optional = true }
rand = { version = "0.8", optional = true }

# Optional: Solana operations
solana-client = { version = "3.1.12", optional = true }
# Align with sol-trade-sdk (solana-message 3.1.x); avoids resolver conflict with solana-client's transitive 3.0.1.
solana-message = { version = "3.1.0", optional = true }
tokio = { version = "1.0", features = ["full"], optional = true }
bincode = { version = "1.3", optional = true }
solana-commitment-config = { version = "3.1.1", optional = true }
# Keep the core crate and integrated UI on the same SDK API.
sol-trade-sdk = { version = "=4.0.21", optional = true }

# Optional: Other utilities
dotenv = { version = "0.15", optional = true }
openssl = { version = "0.10.80", features = ["vendored"], optional = true }

[features]
default = []
cli = ["clap", "qrcode", "totp-rs", "rand"]
2fa = ["totp-rs", "rand", "qrcode"]
sol-trade-sdk = ["dep:sol-trade-sdk", "tokio", "solana-commitment-config", "solana-client", "dep:solana-message"]
mobile-solana-ops = ["solana-client", "dep:solana-message", "tokio", "bincode", "solana-commitment-config"]
solana-ops = ["mobile-solana-ops", "sol-trade-sdk"]
full = ["cli", "2fa", "solana-ops", "sol-trade-sdk", "dotenv", "openssl"]

[lib]
name = "fnzero_safe"
path = "src/lib.rs"

[[bin]]
name = "fnzero-safe"
path = "src/main.rs"
required-features = ["full"]
