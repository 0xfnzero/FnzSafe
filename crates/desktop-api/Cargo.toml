[package]
name = "fnzero-safe-desktop-api"
version = "0.5.2"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[[bin]]
name = "fnzero-safe-desktop-api"
path = "src/main.rs"

[dependencies]
agave-syscalls = { version = "=3.1.12", features = ["agave-unstable-api"] }
fnzero-safe-app-services = { workspace = true }
fnzero-safe-bitcoin-services = { workspace = true }
fnzero-safe-core = { workspace = true, features = ["solana-ops", "2fa", "sol-trade-sdk"] }
fnzero-safe-tron-services = { workspace = true }
sol-trade-sdk = "=4.0.21"
solana-client = "3.1"
solana-commitment-config = "3.1"
solana-account-decoder-client-types = "3.1"
solana-loader-v3-interface = { version = "=6.1.1", features = ["bincode"] }
solana-program-runtime = { version = "=3.1.12", features = ["agave-unstable-api"] }
solana-rpc-client-api = "3.1"
solana-sbpf = "=0.13.1"
solana-sdk = "3.0"
solana-program-pack = "3.0"
solana-system-interface = "3.2"
solana-svm-feature-set = { version = "=3.1.12", features = ["agave-unstable-api"] }
solana-transaction-status-client-types = "3.1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1.6", features = ["derive"] }
bs58 = "0.5"
urlencoding = "2.1"
rust-embed = "8.5"
mime_guess = "2.0"
anyhow = "1.0"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
spl-token = "6.0"
spl-token-interface = "2.0"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
aws-lc-rs = { version = "=1.17.3", default-features = false, features = ["non-fips"] }
base64 = "0.22"
bip39 = { version = "2", features = ["rand", "zeroize"] }
bincode = "1.3"
pem-rfc7468 = { version = "0.7", features = ["std"] }
sha2 = "0.10"
zeroize = "1"
rand = "0.8"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
solana-derivation-path = "3.0"
